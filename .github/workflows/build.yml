name: Build

permissions:
  contents: write

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get release version
        id: app_version
        env:
          TZ: 'Asia/Tokyo'
        run: | # shell
          CURRENT_VERSION=$(sed -n 's/^version=//p' gradle.properties)
          HEAD=$(date +'%Y.%-m.')
          if [[ "$CURRENT_VERSION" == "$HEAD"* ]]; then
            PATCH=$(echo "$CURRENT_VERSION" | awk -F. '{print $NF}' | awk '{print $1 + 1}')
          else
            PATCH=0
          fi
          echo "release=$HEAD$PATCH" >> $GITHUB_OUTPUT

      - name: Rewrite gradle.properties
        run: | # shell
          sed -i 's/^version=.*/version=${{ steps.app_version.outputs.release }}/' gradle.properties

      - name: Build
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > release.keystore
          export STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}'
          export KEY_ALIAS='${{ secrets.KEY_ALIAS }}'
          export KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}'
          ./gradlew assembleRelease

      - name: Prepare deploy
        run: |
          cp ./app/build/outputs/apk/release/app-release.apk ./

      - name: Push gradle.properties changes
        run: | # shell
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gradle.properties
          git commit -m "release: ${{ steps.app_version.outputs.release }}"
          git push

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.app_version.outputs.release }}
          tag_name: v${{ steps.app_version.outputs.release }}
          files: app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
